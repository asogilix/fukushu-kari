<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="勉強用の写真を整理し、忘れかけたころに復習できる写真帳。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>ふくしゅう写真帳</title>
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#home">
        <img src="./icons/icon-192.png" alt="" width="42" height="42">
        <span id="app-name">ふくしゅう写真帳</span>
      </a>
    </div>
  </header>
  <div class="shell">
    <aside id="operation" class="operation" hidden>
      <p id="operation-text" role="status"></p>
      <progress id="operation-progress" aria-label="進み具合"></progress>
    </aside>
    <main id="main">
      <p class="empty">写真帳を開いています。</p>
      <noscript><p class="empty">この写真帳を使うには、ブラウザのせっていでスクリプトを許可してください。</p></noscript>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="画面の切り替え">
    <div>
      <a href="#home" data-tab="home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m3 10.5 9-7.5 9 7.5M5.5 9v11.5h13V9M10 20.5V15h4v5.5"/>
        </svg>
        <span>ほーむ</span>
      </a>
      <a href="#settings" data-tab="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M10.5 3h3v2.7l1.9.8 2-2 2.1 2.1-2 2 .8 1.9H21v3h-2.7l-.8 1.9 2 2-2.1 2.1-2-2-1.9.8V21h-3v-2.7l-1.9-.8-2 2-2.1-2.1 2-2-.8-1.9H3v-3h2.7l.8-1.9-2-2 2.1-2.1 2 2 1.9-.8Z"/>
          <circle cx="12" cy="12" r="2.6"/>
        </svg>
        <span>せってい</span>
      </a>
    </div>
  </nav>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="action-sheet" class="action-sheet" aria-labelledby="sheet-title"></dialog>
</body>
</html>
