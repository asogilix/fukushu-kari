<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141c19" media="(prefers-color-scheme: dark)">
  <meta name="description" content="勉強用の写真を整理し、忘れかけたころに復習できる写真帳。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>写真の復習</title>
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#home">
        <img src="./icons/icon-192.png" alt="" width="42" height="42">
        <span id="app-name">写真の復習</span>
      </a>
    </div>
  </header>
  <div class="shell">
    <aside id="operation" class="operation" hidden>
      <p id="operation-text" role="status"></p>
      <progress id="operation-progress" aria-label="進み具合"></progress>
    </aside>
    <main id="main">
      <p class="empty">写真帳を開いています。</p>
      <noscript><p class="empty">この写真帳を使うには、ブラウザの設定でスクリプトを許可してください。</p></noscript>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="画面の切り替え">
    <div>
      <a href="#home" data-tab="home">ホーム</a>
      <a href="#import" data-tab="import">取りこみ</a>
      <a href="#settings" data-tab="settings">設定</a>
    </div>
  </nav>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
